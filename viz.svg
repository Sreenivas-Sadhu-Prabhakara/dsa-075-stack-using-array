<svg xmlns="http://www.w3.org/2000/svg" width="760" height="491" viewBox="0 0 760 491" role="img" aria-label="Step-by-step visual walkthrough">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="context-stroke"/></marker></defs>
<rect x="1.0" y="1.0" width="758.0" height="489.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="600">Stack on an Array — the top is the only door</text>
<circle cx="35.0" cy="74.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="78.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">A stack is Last-In-First-Out: push and pop happen at ONE end. An array with a top</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">index does it — push appends, pop retreats.</text>
<rect x="84.0" y="114.0" width="130.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="149.0" y="133.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">7</text>
<rect x="84.0" y="145.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="164.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">5</text>
<rect x="84.0" y="176.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="195.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">3</text>
<text x="226.0" y="133.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">← top</text>
<text x="72.0" y="165.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">after push 3,5,7</text>
<line x1="24.0" y1="221.0" x2="736.0" y2="221.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="241.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="245.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="246.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Pop returns 7 — the newest element. No shifting, no copying: the slice just gets one</text>
<text x="56.0" y="265.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">shorter.</text>
<rect x="84.0" y="281.0" width="130.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="149.0" y="300.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">5</text>
<rect x="84.0" y="312.0" width="130.0" height="28.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="149.0" y="331.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">3</text>
<text x="226.0" y="300.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#2563eb" text-anchor="start" font-weight="600">← top</text>
<text x="72.0" y="317.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">after pop → 7</text>
<line x1="24.0" y1="357.0" x2="736.0" y2="357.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="377.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="381.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="382.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Every operation is O(1). The subtle contract: Pop on empty returns ok=false, not a</text>
<text x="56.0" y="401.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">panic — callers decide what empty means.</text>
<text x="72.0" y="436.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">contract</text>
<rect x="84.0" y="417.0" width="198.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="183.0" y="436.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">push/pop/peek → O(1)</text>
<rect x="292.0" y="417.0" width="216.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="400.0" y="436.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">empty pop → ok = false</text>
<text x="380.0" y="473.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">github.com/Sreenivas-Sadhu-Prabhakara · dsa series</text>
</svg>